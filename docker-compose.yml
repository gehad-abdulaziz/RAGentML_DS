# Owner: Member 4 (feature/graph-tool)
# Start:  docker compose up -d
# Stop:   docker compose down
# Reset (delete all Neo4j data, e.g. after changing the password):  docker compose down -v
# Browser UI: http://localhost:7474  (login with NEO4J_USER / NEO4J_PASSWORD)
#
# The login comes from your .env file (docker compose reads .env automatically),
# so NEO4J_USER / NEO4J_PASSWORD in .env are the single source of truth.
# If .env is missing, the defaults after ":-" are used (they match .env.example).
# NOTE: Neo4j requires a password of at least 8 characters.
services:
  neo4j:
    image: neo4j:5
    container_name: ragentml_neo4j
    ports:
      - "7474:7474"   # HTTP browser UI
      - "7687:7687"   # Bolt (used by the neo4j Python driver)
    environment:
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-change-me-please}
    volumes:
      - neo4j_data:/data
    restart: unless-stopped

volumes:
  neo4j_data:
